[project]
name = "llm-auditor"
version = "0.0.1"
description = "Automated security auditor for LLM applications: prompts, outputs, tool calls, and API interactions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "pypdf>=6.21.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
llmaudit = "llm_auditor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Planning-doc code blocks are sketches; test fixtures are inputs to audit, not source.
extend-exclude = ["documentation", "tests/fixtures", "tests/semgrep", "tests/semgrep_generated"]

[tool.ruff.lint]
# S = flake8-bandit: this is a security tool, so its own code gets security linting too.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["llm_auditor", "demo", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Deliberately insecure test target. The hardened app gets no exemption.
"demo/vulnerable_app/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "demo", "scripts"]
exclude = ["^tests/fixtures/", "^tests/semgrep/", "^tests/semgrep_generated/"]
# Name modules by path (tests.unit.conftest vs tests.ingestion.conftest) without __init__ files.
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
default-groups = ["dev", "demo"]

[dependency-groups]
demo = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "uvicorn>=0.54.0",
]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
