rules:
  - id: llmaudit-c05-llm-output-to-path-or-url
    metadata: {check: C-05}
    languages: [python]
    severity: ERROR
    message: >-
      Model output chooses a file path or a URL to request. That enables path traversal,
      or SSRF into internal services. Check it against an allow-list first.
    mode: taint
    pattern-sources:
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.completions.create(...)
      - pattern: $CLIENT.responses.create(...)
      - pattern: $CLIENT.messages.create(...)
      - pattern: $MODEL.generate_content(...)
      - patterns:
          - pattern-either:
              - pattern: $OBJ.$METHOD(...)
              - pattern: $METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(a?invoke|a?complete|a?generate|predict|run_agent|ask_llm|call_llm|chat_completion)$
      # The arguments a model chose for a tool call are model output too.
      - pattern: $CALL.function.arguments
      - patterns:
          - pattern-inside: |
              def $HANDLER(..., $ARGS, ...):
                ...
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^(arguments|tool_args|tool_input|tool_arguments)$
          - pattern: $ARGS
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($TARGET, ...)
              - pattern: pathlib.Path($TARGET, ...)
              - pattern: os.path.join(..., $TARGET, ...)
              - pattern: os.remove($TARGET)
              - pattern: shutil.rmtree($TARGET, ...)
              - pattern: requests.$METHOD($TARGET, ...)
              - pattern: httpx.$METHOD($TARGET, ...)
              - pattern: urllib.request.urlopen($TARGET, ...)
          - focus-metavariable: $TARGET
    pattern-sanitizers:
      - patterns:
          - pattern: $CHECK(...)
          - metavariable-regex:
              metavariable: $CHECK
              regex: (?i)^(.*allow.*|validate_url|safe_url|safe_path|resolve_within)$
