# Credential formats. One list, shared by redaction, P-01 (secrets in prompts),
# and A-01 (keys exposed in code, configs, logs, and HTTP traffic).
#
#   pattern:     a Python regular expression
#   group:       the group that holds the secret (0, the default, is the whole match)
#   replacement: what redaction shows instead of the usual masked form
#   generic:     true for broad patterns that need extra evidence before a check reports them
#
# Order matters: when two patterns match the same text, the first one wins.
rules:
  - id: private_key
    title: Private key
    pattern: '(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----'
    replacement: '[PRIVATE KEY]'

  - id: anthropic_key
    title: Anthropic API key
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}'

  - id: openai_key
    title: OpenAI API key
    pattern: '\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}'

  - id: aws_access_key
    title: AWS access key ID
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'

  - id: github_token
    title: GitHub token
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})'

  - id: slack_token
    title: Slack token
    pattern: '\bxox[abprs]-[A-Za-z0-9-]{10,}'

  - id: google_api_key
    title: Google API key
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'

  - id: jwt
    title: JSON Web Token
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

  - id: live_or_test_key
    title: Live or test API key
    pattern: '\b[a-z]+_(?:live|test)_[A-Za-z0-9]{16,}\b'

  - id: bearer_token
    title: Bearer token
    pattern: '\bBearer\s+([A-Za-z0-9._~+/=-]{16,})'
    group: 1

  - id: assigned_secret
    title: Hard-coded secret
    pattern: '(?i)\b(?:api[_-]?key|secret|token|password|passwd|pwd|access[_-]?key)\b["'']?\s*[:=]\s*["'']?([A-Za-z0-9_+/=-]{8,})'
    group: 1
    generic: true
