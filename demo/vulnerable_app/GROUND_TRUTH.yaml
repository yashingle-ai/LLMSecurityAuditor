# Planted flaws in the vulnerable demo app: the ground truth the auditor is measured against.
#
# - location: relative to this directory. A directory matches any finding inside it.
# - stage: the implementation stage that builds the detector for `check`.
# - enabled: set to true once that detector exists. The harness
#   (tests/groundtruth/test_demo_apps.py) then requires a matching finding here.
# - Every flaw is fixed in demo/hardened_app, which must produce no
#   vulnerability or weakness findings at all.

- id: GT-001
  check: P-01
  stage: 4
  location: prompts/system.txt
  description: Billing API key pasted into the system prompt's internal notes.
  enabled: true

- id: GT-002
  check: A-01
  stage: 4
  location: logs
  description: >-
    The same key is written to the trace logs, because every run logs the full
    system prompt. Follows from GT-001.
  enabled: true

- id: GT-003
  check: O-02
  stage: 8
  location: logs
  description: >-
    The key appears in an assistant reply when a user asks for the system
    prompt (the traffic fixture includes this attack). Follows from GT-001.
  enabled: true

